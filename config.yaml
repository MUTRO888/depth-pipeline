model:
  name: "prs-eth/marigold-depth-v1-1"
  torch_dtype: "float16"
  device: "cuda"

sd_relief:
  use_sd_relief: false
  model_id: "runwayml/stable-diffusion-v1-5"
  lora_path: "auto"
  lora_scale: 0.8
  prompt: "intricate micro details, subtle surface texture, high resolution, relief carving"
  negative_prompt: "smooth, blurry, deep shadows, noisy, high contrast"
  num_inference_steps: 20
  guidance_scale: 7.0

preprocess:
  # Geometry Correction Settings (CPU)
  remove_specular: true
  specular_v_threshold: 220
  specular_s_threshold: 50
  normalize_illumination: true
  retinex_sigmas: [15, 80, 250]

inference:
  ensemble_size: 5
  denoising_steps: 10

postprocess:
  gaussian_radius: 2

fusion:
  detail_strength: 0.8
  relief_strength: 0.5
  guided_radius: null    # If null, automatically uses ~1.5% of image size
  guided_eps: 0.001
